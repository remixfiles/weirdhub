name: Telegram Blog Publish

run-name: Telegram Publish - ${{ github.event.client_payload.sessionId }}

on:
  repository_dispatch:
    types: [publish-blog-telegram]
  workflow_dispatch:

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Publish Blog
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PASS1: ${{ secrets.PUBLISH_PASS1 }}
          PASS2: ${{ secrets.PUBLISH_PASS2 }}
          INPUT_PASS1: ${{ secrets.PUBLISH_PASS1 }}
          INPUT_PASS2: ${{ secrets.PUBLISH_PASS2 }}
          POST_SLUG: ${{ github.event.client_payload.slug }}
          POST_CATEGORY: ${{ github.event.client_payload.category }}
          POST_AUTHOR: ${{ github.event.client_payload.author }}
          FEATURED_IMAGE: ${{ github.event.client_payload.featuredImage }}
          META_DESCRIPTION: ${{ github.event.client_payload.metaDescription }}
          REFERENCES: ${{ github.event.client_payload.references }}
          FULL_ARTICLE: ${{ github.event.client_payload.fullArticle }}
          FEATURED: ${{ github.event.client_payload.featured }}
        run: python .github/scripts/publish.py
