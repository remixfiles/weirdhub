    /* ============================================================ */
    /* WeirdHub Blog Publisher - Refined Responsive Stylesheet       */
    /* ============================================================ */

    :root {

        --bg-body: #f4f6f9;

        --text-secondary: #475569;
        --text-muted: #64748b;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.06);
        --radius: 12px;
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark-mode {
        /* Dark Theme */
        --bg-body: #0d1117;
        --bg-card: #161b22;
        --bg-input: #0d1117;
        --border-color: #30363d;
        --border-focus: #ff7a3d;
        --accent: #ff7a3d;

        --text-muted: #6e7681;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 12px 35px rgba(0, 0, 0, 0.5);

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        margin: 0;

        color: var(--text-primary);

  <script>

    // Apps Script Web App URL
    // Replace this with your deployed Google Apps Script Web App URL.
    const PUBLISH_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx11Q8qJu94ecE3oXPRMs0_cGLjxJ91bC7Vj-DIjlK8J3VOUoMF0QBlBXDXfLwJKTcL/exec';


    const imageFileInput = document.getElementById('image-file-input');
const imageUploadBtn = document.getElementById('image-upload-btn');

imageUploadBtn.addEventListener('click', () => {
    imageFileInput.click();
});

imageFileInput.addEventListener('change', () => {
    const file = imageFileInput.files && imageFileInput.files[0];
    if (!file) return;
    handleImageUpload(file);
});

async function handleImageUpload(file) {
    const pass1 = document.getElementById('pass1').value;
    const pass2 = document.getElementById('pass2').value;
    const status = document.getElementById('image-upload-status');

    if (!pass1 || !pass2) {
        status.textContent = 'Please enter both Pass1 and Pass2 before uploading.';
        status.style.display = 'block';
        return;
    }

    if (!file.type.startsWith('image/')) {
        status.textContent = 'Please select a valid image file.';
        status.style.display = 'block';
        return;
    }

    imageUploadBtn.disabled = true;
    imageUploadBtn.textContent = 'Processing...';
    status.textContent = 'Converting image to WebP...';
    status.style.display = 'block';

    const img = new Image();

    img.onload = function() {
        compressToWebP(img, file.name, 0);
    };

    img.onerror = function() {
        imageUploadBtn.disabled = false;
        imageUploadBtn.textContent = 'Upload';
        status.textContent = 'Could not read the selected image.';
        status.style.display = 'block';
    };

    const reader = new FileReader();

    reader.onload = function(event) {
        img.src = event.target.result;
    };

    reader.onerror = function() {
        imageUploadBtn.disabled = false;
        imageUploadBtn.textContent = 'Upload';
        status.textContent = 'Could not load the selected file.';
        status.style.display = 'block';
    };

    reader.readAsDataURL(file);
}

/* Existing WebP conversion logic — unchanged */
function compressToWebP(img, originalName, index) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const scale = Math.min(1, 1280 / img.width);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    let quality = 0.9;
    (function loop() {
        canvas.toBlob(blob => {
            if (blob.size <= 100 * 1024 || quality <= 0.1) {
                renderWebP(blob, originalName, index);
            } else {
                quality -= 0.05;
                loop();
            }
        }, "image/webp", quality);
    })();
}

async function renderWebP(blob, originalName, index) {
    const status = document.getElementById('image-upload-status');

    if (!blob) {
        imageUploadBtn.disabled = false;
        imageUploadBtn.textContent = 'Upload';
        status.textContent = 'WebP conversion failed.';
        status.style.display = 'block';
        return;
    }

    status.textContent = 'WebP ready (' + (blob.size / 1024).toFixed(1) + ' KB). Uploading to Cloudinary...';

    const reader = new FileReader();

    reader.onloadend = async function() {
        try {
            const base64 = reader.result;

            const payload = {
                action: 'upload-image',
                pass1: pass1ForImageUpload(),
                pass2: pass2ForImageUpload(),
                imageBase64: base64,
                fileName: originalName
            };

            const response = await fetch(PUBLISH_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || 'Image upload failed.');
            }

            document.getElementById('featured-image').value = result.url;

            try {
                await navigator.clipboard.writeText(result.url);
            } catch (clipboardError) {
            }

            status.textContent = '✓ Uploaded successfully (' + (blob.size / 1024).toFixed(1) + ' KB)';
            status.style.display = 'block';

        } catch (error) {
            status.textContent = error.message || 'Image upload failed.';
            status.style.display = 'block';
        } finally {
            imageUploadBtn.disabled = false;
            imageUploadBtn.textContent = 'Upload';
            imageFileInput.value = '';
        }
    };

    reader.readAsDataURL(blob);
}

function pass1ForImageUpload() {
    return document.getElementById('pass1').value;
}

function pass2ForImageUpload() {
    return document.getElementById('pass2').value;
}


    async function publishPost() {
      const button = document.getElementById('publishBtn');
      const status = document.getElementById('publish-status');
      const pass1 = document.getElementById('pass1').value;
      const pass2 = document.getElementById('pass2').value;
      const slug = document.getElementById('post-slug').value.trim();
      const category = document.getElementById('post-category').value;
      const author = document.getElementById('post-author').value.trim();
      const featuredImage = document.getElementById('featured-image').value.trim();
      const metaDescription = document.getElementById('meta-description').value.trim();
      const references = document.getElementById('references').value.trim();
      const fullArticle = document.getElementById('full-article').value.trim();

      if (!pass1 || !pass2) {
        showPublishStatus('Please enter both Pass1 and Pass2.', true);
        return;
      }
      if (!slug) {
        showPublishStatus('Please enter the post slug.', true);
        return;
      }
      if (!featuredImage) {
        showPublishStatus('Please enter the Featured Image URL.', true);
        return;
      }
      if (!fullArticle) {
        showPublishStatus('Please paste the full article.', true);
        return;
      }
      if (PUBLISH_ENDPOINT === 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
        showPublishStatus('Apps Script Web App URL is not configured yet.', true);
        return;
      }

      const payload = {
        pass1,
        pass2,
        slug,
        category,
        author,
        featuredImage,
        metaDescription,
        references,
        fullArticle
      };

      button.disabled = true;
      button.textContent = 'Publishing...';
      showPublishStatus('Sending publish request...', false);

      try {
        const response = await fetch(PUBLISH_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Publishing failed.');
        }

        showPublishStatus(result.message || 'Published successfully.', false);
      } catch (error) {
        showPublishStatus(error.message || 'Publishing failed.', true);
      } finally {
        button.disabled = false;
        button.textContent = 'Publish';
      }
    }

    function showPublishStatus(message, isError) {
      const status = document.getElementById('publish-status');
      status.textContent = message;
      status.style.display = 'block';
      status.style.borderColor = isError ? '#dc3545' : 'var(--border-color)';
    }

    function renderPromptButtons() {
      const container = document.getElementById('prompt-buttons-wrapper');
      if (!container) return;

      container.innerHTML = '';

      promptsData.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-prompt-copy';
        btn.innerHTML = `📋 ${item.label}`;

        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(item.text);
            const originalText = btn.innerHTML;
            
            btn.classList.add('copied');
            btn.innerHTML = `✓ Copied!`;

            setTimeout(() => {
              btn.classList.remove('copied');
              btn.innerHTML = originalText;
            }, 2000);
          } catch (err) {
            // ক্লিপবোর্ড পারমিশন ফেইল করলে ফলব্যাক
            const textarea = document.createElement('textarea');
            textarea.value = item.text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            btn.classList.add('copied');
            btn.innerHTML = `✓ Copied!`;
            setTimeout(() => {
              btn.classList.remove('copied');
              btn.innerHTML = `📋 ${item.label}`;
            }, 2000);
          }
        });

        container.appendChild(btn);
      });
    }

    // ইনিশিয়ালাইজেশন
    document.addEventListener('DOMContentLoaded', renderPromptButtons);
    renderPromptButtons();
</script>
