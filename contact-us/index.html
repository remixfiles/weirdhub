<body>
  <div id="navbar-placeholder"></div>

  <div class="container" style="max-width:680px; padding:50px 20px 70px;">
    <h1 style="font-size:2.5rem; margin-bottom:12px;">Get in Touch</h1>
    <p style="color:var(--muted-color); margin-bottom:35px;">We read every message. For story pitches, feedback, or press inquiries, please use the form below.</p>

    <form id="contact-form" onsubmit="handleSubmit(event)">
      <label style="display:block; margin-bottom:6px; font-weight:500;">Your Name</label>
      <input type="text" id="name" required placeholder="Jane Doe">

      <label style="display:block; margin-bottom:6px; font-weight:500;">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label style="display:block; margin-bottom:6px; font-weight:500;">Subject</label>
      <input type="text" id="subject" required placeholder="Story idea / Feedback / Collaboration">

      <label style="display:block; margin-bottom:6px; font-weight:500;">Message</label>
      <textarea id="message" required placeholder="Tell us more..."></textarea>

      <button type="submit" class="btn" style="margin-top:10px;">Send Message</button>
    </form>

    <p style="margin-top:30px; font-size:0.9rem; color:var(--muted-color);">We typically respond within 3–5 business days.</p>

    <div style="display: flex; justify-content: center; padding: 20px;">
      <script>
  atOptions = {

<div id="footer-placeholder"></div>

  <script src="/components.js"></script>
<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBm08grHwAq2gJc8bDv55b4o-f4YkmVBMyjq5jxQwb-fzbTND-XrTwH3kHIjYOjW8_/exec';

  function handleSubmit(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      subject: document.getElementById('subject').value,
      message: document.getElementById('message').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // CORS ব্লক এড়াতে এটি জরুরি
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert('Thank you! Your message has been sent successfully.');
      e.target.reset();
    })
    .catch(error => {
      console.error('Error!', error);
      alert('Something went wrong. Please try again later.');
    })
    .finally(() => {
      btn.textContent = 'Send Message';
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
