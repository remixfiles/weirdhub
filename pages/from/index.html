<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majhabi Videos.COM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap');
        
        :root {
            --primary: #c026d3;
        }
        
        .tail-container {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .heading-font {
            font-family: 'Playfair Display', sans-serif;
        }

        .thumbnail {
            aspect-ratio: 3 / 2;
            object-fit: cover;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* .thumbnail:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        } */
        
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            /* transform: translateY(-2px); */
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .download-btn {
            position: relative;
            overflow: hidden;
        }
        
        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 40%;
            height: 200%;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.4),
                transparent
            );
            transform: skewX(-25deg);
            animation: shimmer 4s infinite;
        }
        
        @keyframes shimmer {
            100% {
                transform: translateX(400%);
            }
        }
    </style>
</head>
<body class="tail-container bg-zinc-950 text-zinc-100 min-h-screen">
    <!-- Header -->
    <header class="border-b border-zinc-800 bg-black py-6">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex flex-col items-center text-center">
                <h1 class="heading-font text-5xl md:text-6xl font-bold tracking-tighter text-white">
                    Majhabi Videos<span class="text-pink-500">.</span>COM
                </h1>
                <p class="mt-3 text-xl text-pink-400 font-medium flex items-center gap-2">
                    <i class="fas fa-exclamation-triangle"></i>
                    This is a 18+ Page
                    <i class="fas fa-exclamation-triangle"></i>
                </p>
                <div class="h-1 w-24 bg-gradient-to-r from-pink-500 to-purple-600 mx-auto mt-6 rounded"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <!-- Video Grid -->
        <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- Subscribe Section -->
    <section class="bg-zinc-900 border-t border-zinc-700 py-16">
        <div class="max-w-2xl mx-auto px-4">
            <div class="bg-zinc-950 border border-zinc-800 rounded-3xl p-10 shadow-2xl">
                <div class="text-center mb-10">
                    <h2 class="text-4xl font-semibold heading-font mb-2">Stay Updated</h2>
                    <p class="text-zinc-400">Subscribe for new exclusive videos every week</p>
                </div>

<form id="subscribe-form" class="space-y-6">
    <!-- Category Dropdown -->
    <div>
        <label class="block text-sm font-medium text-zinc-400 mb-2">Preferred Category</label>
        <div class="relative">
            <select id="category" name="category"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 text-white focus:outline-none focus:border-pink-500 appearance-none">
                <option value="">Select Category</option>
                <option value="majhabi">Majhabi</option>
                <option value="femdom">Femdom</option>
                <option value="cuckold">Cuckold</option>
                <option value="interfaith">Interfaith</option>
                <option value="interracial">Interracial</option>
                <option value="bDSM">BDSM</option>
                <option value="lesbian">Lesbian</option>
                <option value="other">Other</option>
            </select>
            <div class="pointer-events-none absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400">
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </div>

    <!-- Input Fields -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
            <label class="block text-sm font-medium text-zinc-400 mb-2">Name</label>
            <input type="text" id="name" name="name"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-pink-500"
                   placeholder="Your name" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-400 mb-2">Country</label>
            <input type="text" id="country" name="country"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-pink-500"
                   placeholder="Your country" required>
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium text-zinc-400 mb-2">Email Address</label>
        <input type="email" id="email" name="email"
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-pink-500"
               placeholder="you@example.com" required>
    </div>

    <!-- Submit Button -->
    <button type="submit"
            class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 transition-all py-5 rounded-2xl text-lg font-semibold flex items-center justify-center gap-3 group">
        <span>SUBSCRIBE FREE</span>
        <i class="fas fa-arrow-right group-active:translate-x-2 transition"></i>
    </button>
</form>

                <p class="text-center text-xs text-zinc-500 mt-8">
                    We respect your privacy. Unsubscribe anytime.
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black py-8 border-t border-zinc-800">
        <div class="max-w-7xl mx-auto px-4 text-center text-zinc-500 text-sm">
            © 2026 Majhabi Videos.COM • All Rights Reserved • 18+ Only
        </div>
    </footer>

    <script>
        // Tailwind script already loaded via CDN

        // Sample video data
        const videos = [
            { id: 1, title: "Passionate Encounter", img: "https://picsum.photos/id/1015/600/400" },
            { id: 2, title: "Forbidden Desires", img: "https://picsum.photos/id/102/600/400" },
            { id: 3, title: "Midnight Secret", img: "https://picsum.photos/id/133/600/400" },
            { id: 4, title: "Intimate Moments", img: "https://picsum.photos/id/201/600/400" },
            { id: 5, title: "Sensual Night", img: "https://picsum.photos/id/251/600/400" },
            { id: 6, title: "Hidden Passion", img: "https://picsum.photos/id/312/600/400" },
            { id: 7, title: "Desire Unleashed", img: "https://picsum.photos/id/342/600/400" },
            { id: 8, title: "Ecstasy", img: "https://picsum.photos/id/367/600/400" },
            { id: 9, title: "Lustful Embrace", img: "https://picsum.photos/id/433/600/400" },
            { id: 10, title: "After Hours", img: "https://picsum.photos/id/1016/600/400" }
        ];

        // Render video cards
        function renderVideos() {
            const container = document.getElementById('video-grid');
            container.innerHTML = '';

            videos.forEach(video => {
                const cardHTML = `
                    <div class="card bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden group">
                        <a href="https://demo.com" target="_blank" class="block">
                            <img src="${video.img}" 
                                 alt="${video.title}"
                                 class="thumbnail w-full">
                        </a>
                        <div class="p-5">
                            <h3 class="font-medium text-lg mb-4 text-white">${video.title}</h3>
                            <a href="https://demo.com" 
                               target="_blank"
                               class="download-btn w-full bg-white text-black font-semibold py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-amber-300 transition-all active:scale-95">
                                <i class="fas fa-download"></i>
                                DOWNLOAD
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // Form handling
function setupForm() {
    const form = document.getElementById('subscribe-form');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = form.querySelector('button');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Submitting...';

        const formData = new FormData(form);
        
        fetch('https://script.google.com/macros/s/AKfycbzQ_J28BKXh5xivTZnDf_aaCAdXHvQb21zcyQqKQSWuNMQnISEWHxK0W_3JrBI18p1j/exec', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            console.log("Success Response:", data);   // ← কনসোলে দেখতে পাবেন
            if (data.status === "success") {
                submitBtn.innerHTML = `<i class="fas fa-check"></i> SUBSCRIBED!`;
                submitBtn.classList.add('!bg-emerald-600');
                
                setTimeout(() => {
                    form.reset();
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.remove('!bg-emerald-600');
                    submitBtn.disabled = false;
                    alert("Thank you! Subscription successful.");
                }, 2000);
            } else {
                throw new Error(data.message || "Unknown error");
            }
        })
        .catch(error => {
            console.error("Error:", error);   // ← এখানে এরর দেখবেন
            alert("Error: " + error.message);
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        });
    });
}

        // Initialize everything
        window.onload = function() {
            renderVideos();
            setupForm();
            
            // Add some keyboard accessibility
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
                    e.preventDefault();
                    document.getElementById('email').focus();
                }
            });
        };
    </script>
</body>
</html>
